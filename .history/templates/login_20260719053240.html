<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <style>
            
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <span class="brand">Portfolio Admin</span>
            <h1>Login</h1>
            <p class="subtitle">Masuk untuk mengelola konten portfolio</p>
            
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            
            <form method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            
            <div style="margin-top: 16px; text-align: center; font-size: 12px; color: var(--mid-gray-text);">
                Default: admin / admin123
            </div>
        </div>
    </div>
</body>
</html>
